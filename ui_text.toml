# One-line description shown under the algorithm box
[algorithms]
"BFS" = "Breadth-first: complete, fewest actions, ignores cost."
"DFS" = "Depth-first: quick to find a plan, usually not the shortest or cheapest."
"IDDFS" = "Iterative deepening: shortest plan like BFS with the memory of DFS, but re-expands nodes."
"UCS" = "Uniform-cost (Dijkstra): cheapest plan, blind search."
"Greedy" = "Greedy best-first: follows the heuristic only. Fast, not optimal."
"A*" = "A*: f = g + h. Optimal when h is admissible (h_max)."
"Backward-BFS" = "Regression search from the goal back to the initial state."

